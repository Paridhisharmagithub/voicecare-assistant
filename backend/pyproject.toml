[project]
name = "voicecare-assistant"
version = "1.0.0"
description = "Browser-based AI doctor appointment assistant built with Pipecat, ElevenLabs, Gemini, FastAPI and SQLite."
requires-python = ">=3.11,<3.14"
dependencies = [
  "pipecat-ai[runner,webrtc,google,elevenlabs]>=1.3.0,<2.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "sqlalchemy>=2.0.35,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "tzdata>=2026.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
package = false
